        function renderList(items) {
            const container = document.getElementById('priceList');
            container.innerHTML = '';
            if (items.length === 0) {
                container.innerHTML = '<div class="empty-state">No se encontraron productos.</div>';
                return;
            }
            const fragment = document.createDocumentFragment();
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div class="item-info">
                        <span class="item-code">COD: ${escapeHTML(item.cod)}</span>
                        <span class="item-name">${escapeHTML(item.producto)}</span>
                    </div>
                    <div class="item-price">${escapeHTML(item.precio)}</div>
                `;
                fragment.appendChild(card);
            });
            container.appendChild(fragment);
        }

        function dualProductFilter() {
            const query1 = document.getElementById('filter1Input').value.toLowerCase().trim();
            const query2 = document.getElementById('filter2Input').value.toLowerCase().trim();

            const filtered = productsData.filter(item => {
                const productName = item.producto.toLowerCase();
                return productName.includes(query1) && productName.includes(query2);
            });

            renderList(filtered);
        }

        document.getElementById('filter1Input').addEventListener('input', dualProductFilter);
        document.getElementById('filter2Input').addEventListener('input', dualProductFilter);

        document.getElementById('btnClear').addEventListener('click', function() {
            document.getElementById('filter1Input').value = '';
            document.getElementById('filter2Input').value = '';
            renderList(productsData);
        });

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        renderList(productsData);
    </script>
